name: deploy

on:
  push:
    branches: [main]

jobs:
  images:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      sha: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/api/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/videomind-api:${{ github.sha }}
      - name: Worker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/pipeline/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/videomind-worker:${{ github.sha }}
      - name: Web image
        uses: docker/build-push-action@v6
        with:
          context: services/web
          file: services/web/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/videomind-web:${{ github.sha }}

  helm:
    needs: images
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3
      - name: Configure kubeconfig
        env:
          KUBECONFIG_B64: ${{ secrets.KUBECONFIG_B64 }}
        run: |
          if [ -z "$KUBECONFIG_B64" ]; then
            echo "KUBECONFIG_B64 is not set. Skipping the live upgrade."
            exit 0
          fi
          mkdir -p "$HOME/.kube"
          echo "$KUBECONFIG_B64" | base64 -d > "$HOME/.kube/config"
          helm upgrade --install videomind deploy/helm/videomind \
            --namespace videomind --create-namespace \
            --set image.api=ghcr.io/${{ github.repository }}/videomind-api:${{ github.sha }} \
            --set image.worker=ghcr.io/${{ github.repository }}/videomind-worker:${{ github.sha }} \
            --set image.web=ghcr.io/${{ github.repository }}/videomind-web:${{ github.sha }}
