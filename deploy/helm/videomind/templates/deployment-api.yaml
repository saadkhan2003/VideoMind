apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "videomind.fullname" . }}-api
  labels:
    {{- include "videomind.labels" . | nindent 4 }}
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "videomind.name" . }}
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "videomind.name" . }}
        app.kubernetes.io/component: api
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: api
          image: {{ .Values.image.api }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          envFrom:
            - configMapRef:
                name: {{ include "videomind.fullname" . }}-config
            - secretRef:
                name: {{ include "videomind.fullname" . }}-secret
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "videomind.fullname" . }}-data
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "videomind.fullname" . }}-api
  labels:
    {{- include "videomind.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "videomind.name" . }}
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8000
      targetPort: http
