apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "videomind.fullname" . }}-web
  labels:
    {{- include "videomind.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "videomind.name" . }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "videomind.name" . }}
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: web
          image: {{ .Values.image.web }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.web.port }}
          env:
            - name: API_INTERNAL_URL
              value: http://{{ include "videomind.fullname" . }}-api:8000
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "videomind.fullname" . }}-web
  labels:
    {{- include "videomind.labels" . | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: {{ include "videomind.name" . }}
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 3000
      targetPort: http
