apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "videomind.fullname" . }}-qdrant
  labels:
    {{- include "videomind.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "videomind.fullname" . }}-qdrant
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "videomind.name" . }}
      app.kubernetes.io/component: qdrant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "videomind.name" . }}
        app.kubernetes.io/component: qdrant
    spec:
      containers:
        - name: qdrant
          image: {{ .Values.qdrant.image }}
          ports:
            - containerPort: 6333
          readinessProbe:
            httpGet:
              path: /readyz
              port: 6333
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /qdrant/storage
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 2Gi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .Values.qdrant.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "videomind.fullname" . }}-qdrant
spec:
  selector:
    app.kubernetes.io/name: {{ include "videomind.name" . }}
    app.kubernetes.io/component: qdrant
  ports:
    - port: 6333
      name: http
