{{- if .Values.ray.enabled }}
# Requires the KubeRay operator. Left off by default so a fresh k3s install
# does not fail on a missing CRD. See RUNBOOK.md.
apiVersion: ray.io/v1
kind: RayCluster
metadata:
  name: {{ include "videomind.fullname" . }}-ray
  labels:
    {{- include "videomind.labels" . | nindent 4 }}
spec:
  rayVersion: "2.40.0"
  headGroupSpec:
    rayStartParams:
      dashboard-host: "0.0.0.0"
    template:
      spec:
        containers:
          - name: ray-head
            image: {{ .Values.image.worker }}
            ports:
              - containerPort: 6379
                name: gcs
              - containerPort: 8265
                name: dashboard
            resources:
              requests:
                cpu: "1"
                memory: 2Gi
  workerGroupSpecs:
    - groupName: cpu
      replicas: {{ .Values.ray.workerReplicas }}
      minReplicas: 0
      maxReplicas: 4
      rayStartParams: {}
      template:
        spec:
          containers:
            - name: ray-worker
              image: {{ .Values.image.worker }}
              resources:
                requests:
                  cpu: "1"
                  memory: 2Gi
{{- end }}
