apiVersion: v1
kind: Secret
metadata:
  name: {{ include "videomind.fullname" . }}-secret
  labels:
    {{- include "videomind.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  DATABASE_URL: postgresql+psycopg://{{ .Values.postgres.user }}:{{ .Values.postgres.password }}@{{ include "videomind.fullname" . }}-postgres:5432/{{ .Values.postgres.database }}
  API_KEY: {{ .Values.config.apiKey | default "" | quote }}
  S3_ACCESS_KEY: {{ .Values.config.s3AccessKey | default "" | quote }}
  S3_SECRET_KEY: {{ .Values.config.s3SecretKey | default "" | quote }}
  OPENROUTER_API_KEY: {{ .Values.config.openrouterApiKey | default "" | quote }}
  LANGFUSE_PUBLIC_KEY: {{ .Values.config.langfusePublicKey | default "" | quote }}
  LANGFUSE_SECRET_KEY: {{ .Values.config.langfuseSecretKey | default "" | quote }}
  SIGNING_SECRET: {{ .Values.config.signingSecret | default "dev-only-change-me" | quote }}
