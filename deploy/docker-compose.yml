# Local stack. Passwords here are for a laptop only. Do not reuse them anywhere else.
# Copy ../../.env.example to ../../.env before `make up` if you want the API to
# talk to Postgres, Qdrant, and MinIO instead of the embedded defaults.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: videomind
      POSTGRES_PASSWORD: videomind
      POSTGRES_DB: videomind
    ports:
      - "5432:5432"
    volumes:
      - pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U videomind"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  qdrant:
    image: qdrant/qdrant:v1.13.4
    ports:
      - "6333:6333"
    volumes:
      - qdrant:/qdrant/storage

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio:/data

  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 minio minio-secret; do sleep 1; done;
      mc mb -p local/videomind || true;
      mc anonymous set none local/videomind || true;
      "

  api:
    build:
      context: ..
      dockerfile: services/api/Dockerfile
    env_file:
      - path: ../.env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://videomind:videomind@postgres:5432/videomind
      QDRANT_URL: http://qdrant:6333
      QDRANT_PATH: ""
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: videomind
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio-secret
      S3_REGION: us-east-1
      S3_USE_SSL: "false"
      REDIS_URL: redis://redis:6379/0
      WORKER_BACKEND: poll
      PUBLIC_BASE_URL: http://localhost:8000
      DATA_DIR: /data
    ports:
      - "8000:8000"
    volumes:
      - api-data:/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: services/pipeline/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://videomind:videomind@postgres:5432/videomind
      QDRANT_URL: http://qdrant:6333
      QDRANT_PATH: ""
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: videomind
      S3_ACCESS_KEY: minio
      S3_SECRET_KEY: minio-secret
      S3_REGION: us-east-1
      S3_USE_SSL: "false"
      REDIS_URL: redis://redis:6379/0
      WORKER_BACKEND: poll
      DATA_DIR: /data
      WHISPER_MODEL: tiny
      CAPTION_BACKEND: mock
    volumes:
      - api-data:/data
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ../services/web
      dockerfile: Dockerfile
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "43123:3000"
    depends_on:
      - api

  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:11.3.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus

volumes:
  pg:
  qdrant:
  minio:
  api-data:
